<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QA AI Platform</title>
<style>
  :root{
    --ink:#102033; --muted:#6b7a90; --panel:#fff; --line:#dbe5f1;
    --primary:#2563eb; --primary2:#0ea5e9; --nav:#0f172a; --nav2:#15233a;
    --green:#16a34a; --red:#ef4444;
    --shadow:0 18px 45px rgba(15,23,42,.10); --soft:0 8px 22px rgba(15,23,42,.07); --radius:20px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#eef6ff 0,#f7f9fc 40%,#eef3f8 100%);
    min-height:100vh;display:flex;overflow-x:hidden}
  .sidebar{width:260px;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#dbeafe;
    padding:24px 16px;position:sticky;top:0;height:100vh;box-shadow:12px 0 28px rgba(15,23,42,.18)}
  .logoRow{display:flex;gap:12px;align-items:center;margin-bottom:24px}
  .logoIcon{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#60a5fa,#22d3ee);
    display:grid;place-items:center;font-size:22px}
  .logoText b{display:block;color:#fff;font-size:19px}.logoText span{font-size:12px;color:#b7c6dc}
  .nav button{width:100%;border:0;background:transparent;color:#dbeafe;text-align:right;
    padding:12px 13px;border-radius:13px;display:flex;gap:10px;align-items:center;font-size:14.5px;
    cursor:pointer;transition:.15s;margin:3px 0}
  .nav button:hover{background:rgba(255,255,255,.08)}
  .nav button.active{background:#fff;color:#1d4ed8;font-weight:800;box-shadow:var(--soft)}
  .ico{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.12);display:grid;place-items:center}
  .active .ico{background:#eff6ff}
  .main{flex:1;padding:28px;max-width:1100px}
  .screen{display:none;animation:fade .2s ease}.screen.active{display:block}
  @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .hero{background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#0ea5e9);border-radius:24px;
    padding:24px 28px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;left:-70px;top:-80px;width:220px;height:220px;
    border-radius:50%;background:rgba(255,255,255,.13)}
  .hero h1{font-size:27px;margin:6px 0 4px}.hero p{margin:0;color:#eaf2ff;line-height:1.6;max-width:620px}
  .badge{display:inline-flex;gap:8px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);
    border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px;box-shadow:var(--soft);margin-top:20px}
  .card h2{margin:0 0 4px;font-size:20px}.card .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{margin-bottom:16px}
  .field label.lbl{display:block;font-size:13px;color:var(--muted);font-weight:800;margin-bottom:8px}
  .field input[type=text]{width:100%;background:#f8fafc;border:1px solid #d6e0eb;border-radius:13px;padding:12px;color:#334155;font-size:14px}
  .field input[type=file]{width:100%;font-size:13px;color:#334155;background:#f8fafc;border:1px solid #d6e0eb;border-radius:13px;padding:11px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg label{flex:1;min-width:120px;background:#fff;border:1px solid #d6e0eb;border-radius:13px;
    padding:11px 12px;text-align:center;cursor:pointer;font-size:14px;font-weight:700;color:#334155;transition:.15s}
  .seg input{display:none}
  .seg label:has(input:checked){border-color:#2563eb;background:#eff6ff;color:#1d4ed8;box-shadow:var(--soft)}
  .hidden{display:none}
  .btn{margin-top:8px;display:inline-flex;gap:9px;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;border:0;border-radius:14px;
    padding:13px 22px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:var(--soft)}
  .btn.full{width:100%}
  .btn.ghost{background:#eff6ff;color:#1d4ed8}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .status{margin-top:18px;border-radius:14px;padding:15px 16px;font-size:14px;line-height:1.6;display:none}
  .status.show{display:block}
  .status.run{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}
  .status.ok{background:#dcfce7;border:1px solid #bbf7d0;color:#166534}
  .status.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
  .spinner{width:16px;height:16px;border:3px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;
    display:inline-block;vertical-align:middle;animation:spin 1s linear infinite;margin-left:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dl{display:inline-block;margin-top:10px;background:#166534;color:#fff;text-decoration:none;border-radius:12px;padding:10px 16px;font-weight:800}
  .topRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .topRow h1{font-size:26px;margin:0}
  table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:var(--soft)}
  th{background:#1f4e79;color:#fff;text-align:right;padding:12px;font-size:13px}
  td{padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:#eff6ff;color:#1d4ed8}
  .dlbtn{background:#166534;color:#fff;text-decoration:none;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px}
  .empty{border:1px dashed #cbd5e1;background:#f8fafc;border-radius:16px;padding:28px;color:#64748b;text-align:center}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.sidebar{width:210px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logoRow"><div class="logoIcon">✦</div><div class="logoText"><b>QA AI Platform</b><span>Agent Hub</span></div></div>
  <div class="nav">
    <button class="active" onclick="show('run',this)"><span class="ico">▶</span>Run Agent</button>
    <button onclick="show('outputs',this)"><span class="ico">📦</span>Output Center</button>
  </div>
</aside>

<main class="main">
  <!-- ===== Run Agent ===== -->
  <section id="run" class="screen active">
    <div class="hero">
      <span class="badge">✦ STD Generator</span>
      <h1>הרצת סוכן</h1>
      <p>העלה מסמך אפיון, בחר מצב הרצה וסוג תוצר, והסוכן יפיק תסריטי בדיקה ו/או שאילתות SQL כקובץ Excel.</p>
    </div>

    <div class="card">
      <h2>Run Agent</h2>
      <p class="sub">פורמטים נתמכים: ‎.docx · .xlsx · .pdf</p>
      <form id="form">
        <div class="field">
          <label class="lbl">מסמך אפיון</label>
          <input type="file" id="file" accept=".docx,.xlsx,.pdf" required />
        </div>
        <div class="field">
          <label class="lbl">מצב הרצה</label>
          <div class="seg">
            <label><input type="radio" name="mode" value="tag" checked>תיוג ספציפי</label>
            <label><input type="radio" name="mode" value="whole">כלל האפיון</label>
          </div>
        </div>
        <div class="grid">
          <div class="field" id="tagField">
            <label class="lbl">מספר תיוג</label>
            <input type="text" id="tag" placeholder="לדוגמה: 40100" />
          </div>
          <div class="field">
            <label class="lbl">מספר משימה (לשם הקובץ)</label>
            <input type="text" id="task" placeholder="לדוגמה: 40100" />
          </div>
        </div>
        <div class="field">
          <label class="lbl">סוג תוצר</label>
          <div class="seg">
            <label><input type="radio" name="out" value="both" checked>תסריטים + SQL</label>
            <label><input type="radio" name="out" value="scenarios">תסריטים בלבד</label>
            <label><input type="radio" name="out" value="sql">SQL בלבד</label>
          </div>
        </div>
        <button class="btn full" id="submit" type="submit">הפק STD ⟵</button>
      </form>
      <div class="status" id="status"></div>
    </div>
  </section>

  <!-- ===== Output Center ===== -->
  <section id="outputs" class="screen">
    <div class="topRow">
      <h1>📦 Output Center</h1>
      <button class="btn ghost" onclick="loadRuns()">רענן</button>
    </div>
    <div id="runsArea">
      <div class="empty">טוען…</div>
    </div>
  </section>
</main>

<script>
  function show(id, btn){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (id === 'outputs') loadRuns();
  }

  const OUT_LABEL = { both: 'תסריטים + SQL', scenarios: 'תסריטים', sql: 'SQL' };

  async function loadRuns(){
    const area = document.getElementById('runsArea');
    area.innerHTML = '<div class="empty">טוען…</div>';
    try {
      const res = await fetch('/api/runs');
      const runs = await res.json();
      if (!runs.length) { area.innerHTML = '<div class="empty">אין הרצות עדיין. הפק STD ראשון ממסך Run Agent.</div>'; return; }
      let rows = '';
      for (const r of runs){
        const when = new Date(r.created_at).toLocaleString('he-IL');
        rows += '<tr>' +
          '<td>' + r.id + '</td>' +
          '<td>' + when + '</td>' +
          '<td>' + (r.tag || '—') + '</td>' +
          '<td>' + (r.task_number || '—') + '</td>' +
          '<td><span class="pill">' + (OUT_LABEL[r.output_type] || r.output_type) + '</span></td>' +
          '<td>' + r.filename + '</td>' +
          '<td><a class="dlbtn" href="/api/runs/' + r.id + '/download">⬇ הורד</a></td>' +
          '</tr>';
      }
      area.innerHTML =
        '<table><thead><tr>' +
        '<th>#</th><th>תאריך</th><th>תיוג</th><th>משימה</th><th>סוג תוצר</th><th>קובץ</th><th>הורדה</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    } catch (err) {
      area.innerHTML = '<div class="empty">שגיאה בטעינת ההיסטוריה: ' + err.message + '</div>';
    }
  }

  // ===== Run Agent form =====
  const form = document.getElementById('form');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submit');
  const tagField = document.getElementById('tagField');
  const mode = () => document.querySelector('input[name="mode"]:checked').value;
  const outType = () => document.querySelector('input[name="out"]:checked').value;

  document.querySelectorAll('input[name="mode"]').forEach(r =>
    r.addEventListener('change', () => tagField.classList.toggle('hidden', mode() !== 'tag'))
  );

  function setStatus(kind, html){ statusEl.className = 'status show ' + kind; statusEl.innerHTML = html; }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = document.getElementById('file').files[0];
    const tag = document.getElementById('tag').value.trim();
    const task = document.getElementById('task').value.trim();
    const selectedMode = mode();    // snapshot the selections at submit time so a
    const selectedOut = outType();  // change during generation can't desync the file name

    if (!file) { setStatus('err', '❌ יש לבחור מסמך אפיון'); return; }
    if (selectedMode === 'tag' && !tag) { setStatus('err', '❌ במצב "תיוג ספציפי" חובה להזין מספר תיוג'); return; }
    const nameKey = task || tag;
    if (!nameKey) { setStatus('err', '❌ יש להזין מספר משימה או תיוג לשם הקובץ'); return; }

    submitBtn.disabled = true;
    setStatus('run', 'הסוכן עובד על האפיון… זה עשוי לקחת עד דקה.<span class="spinner"></span>');

    const data = new FormData();
    data.append('file', file);
    data.append('mode', selectedMode);
    data.append('tag', tag);
    data.append('task_number', task);
    data.append('output_type', selectedOut);

    try {
      const res = await fetch('/api/generate', { method: 'POST', body: data });
      if (!res.ok) {
        let detail = 'אירעה שגיאה.';
        try { detail = (await res.json()).detail || detail; } catch (_) {}
        setStatus('err', '❌ ' + detail);
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const suffix = selectedOut === 'both' ? 'scenarios_sql' : selectedOut;
      const name = 'STD_' + nameKey + '_' + suffix + '.xlsx';
      setStatus('ok',
        '✅ הקובץ נוצר בהצלחה!' +
        '<br><a class="dl" href="' + url + '" download="' + name + '">⬇ הורד את ' + name + '</a>');
      loadRuns();  // keep the Output Center history fresh
    } catch (err) {
      setStatus('err', '❌ שגיאת רשת: ' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
