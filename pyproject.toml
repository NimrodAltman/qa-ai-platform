[project]
name = "qa-ai-platform"
version = "0.1.0"
description = "Extensible, config-driven platform for AI-powered QA agents"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
